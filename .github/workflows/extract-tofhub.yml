name: Extract TOFHub ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract archive
        shell: bash
        run: |
          test -f TOFHub.zip
          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath
          archive = zipfile.ZipFile("TOFHub.zip")
          for entry in archive.infolist():
              path = PurePosixPath(entry.filename)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"Unsafe archive path: {entry.filename}")
          archive.extractall(".")
          print("Extracted", len(archive.infolist()), "entries")
          PY

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TOFHub/
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
          else
            git commit -m "Extract TOFHub source archive"
            git push
          fi
